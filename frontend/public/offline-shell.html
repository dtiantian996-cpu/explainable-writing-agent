<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YASI Offline Shell</title>
    <style>
      :root {
        color-scheme: light;
        --background: #ffffff;
        --foreground: #171717;
        --muted: #fafafa;
        --muted-foreground: #666666;
        --border: #ebebeb;
        --primary: #171717;
        --primary-foreground: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Geist", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--background);
        color: var(--foreground);
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 240px minmax(0, 1fr);
      }

      .sidebar {
        padding: 24px;
        border-right: 1px solid var(--border);
        background: var(--muted);
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 24px;
      }

      .brand,
      .nav-link,
      .footer-copy,
      .banner,
      .copy {
        margin: 0;
      }

      .brand {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .nav {
        display: grid;
        gap: 10px;
      }

      .nav-link {
        padding: 10px 12px;
        border-radius: 999px;
        background: #f2f2f2;
        color: var(--muted-foreground);
        font-size: 13px;
      }

      .nav-link.is-active {
        background: #171717;
        color: #ffffff;
      }

      .footer-copy {
        color: var(--muted-foreground);
        font-size: 12px;
        line-height: 1.6;
      }

      .main {
        padding: 24px 32px 40px;
        display: grid;
        align-content: start;
        gap: 20px;
      }

      .banner {
        padding: 12px 16px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--muted);
        color: var(--muted-foreground);
        font-size: 13px;
      }

      h1 {
        margin: 0;
        font-size: clamp(32px, 5vw, 48px);
        line-height: 1.05;
        letter-spacing: -0.06em;
      }

      .copy {
        max-width: 720px;
        color: var(--muted-foreground);
        font-size: 15px;
        line-height: 1.7;
      }

      .panel {
        max-width: 720px;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--background);
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 20px;
        line-height: 1.2;
        letter-spacing: -0.04em;
      }

      @media (max-width: 900px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .main {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="YASI Offline Workspace">
        <div>
          <p class="brand">YASI</p>
          <p class="footer-copy">IELTS Writing Lab</p>
        </div>
        <nav class="nav" aria-label="Offline Navigation">
          <p class="nav-link is-active">缓存壳层</p>
          <p class="nav-link">等待恢复网络</p>
          <p class="nav-link">再次刷新数据</p>
        </nav>
        <p class="footer-copy">当前处于离线状态，先保留工作台壳层，不把你丢回浏览器错误页。</p>
      </aside>

      <main class="main">
        <p class="banner">当前处于离线状态，页面正在使用缓存壳层显示。恢复网络后再刷新数据。</p>
        <h1>YASI 缓存壳层已加载。</h1>
        <p class="copy">
          这不是完整的实时页面，而是最小可用的产品外壳。等网络恢复后重新刷新，历史、错题本、画像和最新评估会继续从真实接口拉取。
        </p>
        <section class="panel">
          <h2>离线时仍然保留的东西</h2>
          <p class="copy">品牌、导航语义、页面层级和操作预期都还在。真正不该出现的，是浏览器原生的断网页或一片白屏。</p>
        </section>
      </main>
    </div>
  </body>
</html>
