[project]
name = "yasi-backend"
version = "0.1.0"
description = "YASI backend scaffold (FastAPI + uv)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.135.3",
  "greenlet==3.2.4",
  "pydantic==2.12.5",
  "python-multipart==0.0.20",
  "reportlab==4.4.10",
  "sqlalchemy==2.0.49",
  "alembic==1.18.4",
  "langchain==0.3.28",
  "langchain-community==0.3.31",
  "langgraph==0.3.34",
  "chromadb==0.5.23",
  "dashscope==1.24.2",
  "paddleocr==3.4.0",
  "paddlepaddle==3.3.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "asyncmy==0.2.11",
  "cryptography==46.0.2",
  "httpx==0.28.1",
  "uvicorn[standard]==0.37.0",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.9",
  "mypy==1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["app", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
